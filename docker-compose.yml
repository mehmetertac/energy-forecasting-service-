services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri file:///mlflow
      --default-artifact-root file:///mlflow/artifacts
      --serve-artifacts
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  batch:
    build: .
    command: python scripts/daily_forecast.py --seed-if-missing
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FORECAST_DB: /data/forecasts.db
    volumes:
      - mlflow-data:/mlflow
      - forecast-data:/data
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FORECAST_DB: /data/forecasts.db
    volumes:
      - mlflow-data:/mlflow
      - forecast-data:/data
    depends_on:
      mlflow:
        condition: service_healthy
      batch:
        condition: service_completed_successfully

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  mlflow-data:
  forecast-data:
