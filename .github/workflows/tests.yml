name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (no torch)
        run: pip install -e ".[dev,serve]"
      - name: File size guard
        run: python scripts/check_file_size.py
      - name: Unit tests
        run: pytest tests/ -q
