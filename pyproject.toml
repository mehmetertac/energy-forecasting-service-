[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-forecasting-service"
version = "0.1.0"
description = "Probabilistic solar TFT serving stack: MLflow tracking, FastAPI, Streamlit"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "mehmetertac" }]
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.26,<2",
    "matplotlib>=3.8,<4",
    "requests>=2.31,<3",
    "pyarrow>=14.0,<19",
    "pvlib>=0.10,<1",
    "holidays>=0.40,<1",
    "scikit-learn>=1.3,<2",
    "mlflow>=2.14,<3",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
train = [
    "torch>=2.1,<3",
    "pytorch-lightning>=2.1,<3",
    "pytorch-forecasting>=1.0,<2",
]
wandb = [
    "wandb>=0.17,<1",
]
serve = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "httpx>=0.27,<1",
]
dev = [
    "pytest>=7.4,<9",
    "pre-commit>=3.6,<5",
    "ruff>=0.4,<1",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts"]
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
